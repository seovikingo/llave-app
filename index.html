<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Llave — generador de contraseñas</title>
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/icon-192.png">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="theme-color" content="#0F1720">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Llave">
<style>
  :root{
    --bg: #0F1720;
    --panel: #16212C;
    --panel-2: #1C2A37;
    --ink: #E7EEF3;
    --ink-dim: #8CA0AF;
    --line: #29394A;
    --accent: #4FD1B5;
    --accent-dim: #2E7A6B;
    --warn: #E4A94F;
    --danger: #E1615A;
  }
  *{box-sizing:border-box;}
  html,body{margin:0;padding:0;}
  body{
    background: var(--bg);
    color: var(--ink);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    min-height:100vh;
    display:flex;
    align-items:center;
    justify-content:center;
    padding: 28px 16px;
  }
  .card{
    width:100%;
    max-width: 460px;
  }
  .brand{
    display:flex;
    align-items:baseline;
    gap:10px;
    margin-bottom: 22px;
  }
  .brand-mark{
    width: 30px;
    height: 30px;
    flex-shrink:0;
  }
  .brand h1{
    font-size: 20px;
    font-weight: 600;
    margin:0;
    letter-spacing: -0.01em;
  }
  .brand span{
    color: var(--ink-dim);
    font-size: 13px;
  }

  .password-shell{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 20px 18px;
    margin-bottom: 16px;
  }
  .password-display{
    font-family: "SF Mono", "Cascadia Code", Consolas, monospace;
    font-size: clamp(19px, 5.4vw, 25px);
    line-height: 1.4;
    word-break: break-all;
    min-height: 66px;
    display:flex;
    align-items:center;
    color: var(--ink);
  }
  .password-display .char-sym{ color: var(--accent); }
  .password-display .char-num{ color: var(--warn); }

  .row-actions{
    display:flex;
    gap: 10px;
    margin-top: 14px;
  }
  button{
    font-family: inherit;
    cursor:pointer;
    border: none;
    border-radius: 10px;
  }
  .btn-primary{
    flex: 1;
    background: var(--accent);
    color: #06231D;
    font-size: 15px;
    font-weight: 600;
    padding: 12px 16px;
    transition: transform .08s ease, background .15s ease;
  }
  .btn-primary:active{ transform: scale(0.97); }
  .btn-copy{
    background: var(--panel-2);
    color: var(--ink);
    border: 1px solid var(--line);
    padding: 12px 16px;
    font-size: 14px;
    min-width: 84px;
    transition: background .15s ease;
  }
  .btn-copy.copied{
    background: var(--accent-dim);
    color: white;
    border-color: var(--accent-dim);
  }

  .strength{
    margin-top: 14px;
  }
  .strength-bar{
    height: 5px;
    background: var(--line);
    border-radius: 3px;
    overflow: hidden;
    display:flex;
    gap: 3px;
  }
  .strength-seg{
    flex:1;
    background: var(--line);
    border-radius: 2px;
    transition: background .2s ease;
  }
  .strength-label{
    font-size: 12px;
    color: var(--ink-dim);
    margin-top: 7px;
    display:flex;
    justify-content: space-between;
  }

  .controls{
    background: var(--panel);
    border: 1px solid var(--line);
    border-radius: 14px;
    padding: 18px;
  }
  .control-row{
    display:flex;
    align-items:center;
    justify-content: space-between;
    padding: 12px 0;
  }
  .control-row + .control-row{
    border-top: 1px solid var(--line);
  }
  .control-label{
    font-size: 14.5px;
  }
  .control-label small{
    display:block;
    color: var(--ink-dim);
    font-size: 12px;
    margin-top: 2px;
  }

  input[type="range"]{
    -webkit-appearance:none;
    width: 100%;
    height: 4px;
    background: var(--line);
    border-radius: 2px;
    outline:none;
  }
  input[type="range"]::-webkit-slider-thumb{
    -webkit-appearance:none;
    width: 20px;
    height: 20px;
    border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--bg);
    box-shadow: 0 0 0 1px var(--accent);
    cursor:pointer;
  }
  .length-row{
    display:flex;
    flex-direction:column;
    gap: 10px;
    padding: 12px 0;
  }
  .length-top{
    display:flex;
    justify-content: space-between;
    align-items:baseline;
  }
  .length-value{
    font-family: "SF Mono", Consolas, monospace;
    font-size: 17px;
    color: var(--accent);
    font-weight: 600;
  }

  .toggle{
    position: relative;
    width: 46px;
    height: 27px;
    background: var(--line);
    border-radius: 20px;
    flex-shrink:0;
    transition: background .15s ease;
  }
  .toggle.on{ background: var(--accent-dim); }
  .toggle::after{
    content:"";
    position:absolute;
    top: 3px;
    left: 3px;
    width: 21px;
    height: 21px;
    background: var(--ink-dim);
    border-radius: 50%;
    transition: transform .15s ease, background .15s ease;
  }
  .toggle.on::after{
    transform: translateX(19px);
    background: var(--accent);
  }

  .footnote{
    text-align:center;
    color: var(--ink-dim);
    font-size: 12px;
    margin-top: 18px;
    line-height: 1.6;
  }
</style>
</head>
<body>

<div class="card">
  <div class="brand">
    <svg class="brand-mark" viewBox="0 0 30 30" fill="none">
      <path d="M15 2 L26 7 V15 C26 21.5 21 26.5 15 28 C9 26.5 4 21.5 4 15 V7 Z" stroke="#4FD1B5" stroke-width="1.6"/>
      <circle cx="15" cy="14" r="3" stroke="#4FD1B5" stroke-width="1.4"/>
      <path d="M15 17 V21" stroke="#4FD1B5" stroke-width="1.4" stroke-linecap="round"/>
    </svg>
    <h1>Llave</h1>
    <span>generador de contraseñas</span>
  </div>

  <div class="password-shell">
    <div class="password-display" id="passwordDisplay"></div>
    <div class="row-actions">
      <button class="btn-primary" id="generateBtn">Generar nueva</button>
      <button class="btn-copy" id="copyBtn">Copiar</button>
    </div>
    <div class="strength">
      <div class="strength-bar">
        <div class="strength-seg" id="seg1"></div>
        <div class="strength-seg" id="seg2"></div>
        <div class="strength-seg" id="seg3"></div>
        <div class="strength-seg" id="seg4"></div>
      </div>
      <div class="strength-label">
        <span id="strengthText">—</span>
        <span id="entropyText"></span>
      </div>
    </div>
  </div>

  <div class="controls">
    <div class="length-row">
      <div class="length-top">
        <span class="control-label">Longitud</span>
        <span class="length-value" id="lengthValue">16</span>
      </div>
      <input type="range" id="lengthSlider" min="8" max="32" value="16">
    </div>

    <div class="control-row">
      <div class="control-label">Mayúsculas<small>A B C…</small></div>
      <div class="toggle on" id="toggleUpper" data-key="upper"></div>
    </div>
    <div class="control-row">
      <div class="control-label">Minúsculas<small>a b c…</small></div>
      <div class="toggle on" id="toggleLower" data-key="lower"></div>
    </div>
    <div class="control-row">
      <div class="control-label">Números<small>0 1 2…</small></div>
      <div class="toggle on" id="toggleNumbers" data-key="numbers"></div>
    </div>
    <div class="control-row">
      <div class="control-label">Símbolos<small>! @ # $…</small></div>
      <div class="toggle on" id="toggleSymbols" data-key="symbols"></div>
    </div>
    <div class="control-row">
      <div class="control-label">Evitar caracteres ambiguos<small>0/O, 1/l/I</small></div>
      <div class="toggle" id="toggleAmbiguous" data-key="ambiguous"></div>
    </div>
  </div>

  <div class="footnote">Todo se genera en tu propio navegador.<br>Nada se envía ni se guarda en ningún servidor.</div>
</div>

<script>
  const state = {
    length: 16,
    upper: true,
    lower: true,
    numbers: true,
    symbols: true,
    ambiguous: false
  };

  const SETS = {
    upper: "ABCDEFGHIJKLMNOPQRSTUVWXYZ",
    lower: "abcdefghijklmnopqrstuvwxyz",
    numbers: "0123456789",
    symbols: "!@#$%^&*()-_=+[]{}?/.,",
    ambiguousChars: "0O1lI"
  };

  const display = document.getElementById('passwordDisplay');
  const lengthSlider = document.getElementById('lengthSlider');
  const lengthValue = document.getElementById('lengthValue');
  const strengthText = document.getElementById('strengthText');
  const entropyText = document.getElementById('entropyText');
  const segs = [1,2,3,4].map(n => document.getElementById('seg'+n));
  const copyBtn = document.getElementById('copyBtn');

  function buildAlphabet(){
    let alphabet = "";
    if(state.upper) alphabet += SETS.upper;
    if(state.lower) alphabet += SETS.lower;
    if(state.numbers) alphabet += SETS.numbers;
    if(state.symbols) alphabet += SETS.symbols;
    if(state.ambiguous){
      alphabet = alphabet.split('').filter(c => !SETS.ambiguousChars.includes(c)).join('');
    }
    return alphabet;
  }

  function secureRandomInt(max){
    const arr = new Uint32Array(1);
    const limit = Math.floor(0xFFFFFFFF / max) * max;
    let val;
    do {
      crypto.getRandomValues(arr);
      val = arr[0];
    } while (val >= limit);
    return val % max;
  }

  function generatePassword(){
    const alphabet = buildAlphabet();
    if(alphabet.length === 0){
      display.textContent = "Activa al menos un tipo de carácter";
      return;
    }
    let pwd = "";
    for(let i = 0; i < state.length; i++){
      pwd += alphabet[secureRandomInt(alphabet.length)];
    }
    renderPassword(pwd);
    updateStrength(alphabet.length, state.length);
  }

  function renderPassword(pwd){
    display.innerHTML = pwd.split('').map(c => {
      if(/[0-9]/.test(c)) return `<span class="char-num">${c}</span>`;
      if(/[A-Za-z]/.test(c)) return c;
      return `<span class="char-sym">${c}</span>`;
    }).join('');
    display.dataset.raw = pwd;
  }

  function updateStrength(alphabetSize, length){
    const entropy = Math.round(length * Math.log2(alphabetSize));
    entropyText.textContent = entropy + " bits";

    let level = 0;
    if(entropy >= 40) level = 1;
    if(entropy >= 60) level = 2;
    if(entropy >= 80) level = 3;
    if(entropy >= 100) level = 4;

    const colors = ['#E1615A','#E1615A','#E4A94F','#4FD1B5','#4FD1B5'];
    const labels = ['Débil','Débil','Aceptable','Fuerte','Muy fuerte'];

    segs.forEach((seg, i) => {
      seg.style.background = i < level ? colors[level] : 'var(--line)';
    });
    strengthText.textContent = labels[level];
  }

  function toggle(el, key){
    state[key] = !state[key];
    el.classList.toggle('on', state[key]);
    generatePassword();
  }

  document.getElementById('toggleUpper').addEventListener('click', function(){ toggle(this, 'upper'); });
  document.getElementById('toggleLower').addEventListener('click', function(){ toggle(this, 'lower'); });
  document.getElementById('toggleNumbers').addEventListener('click', function(){ toggle(this, 'numbers'); });
  document.getElementById('toggleSymbols').addEventListener('click', function(){ toggle(this, 'symbols'); });
  document.getElementById('toggleAmbiguous').addEventListener('click', function(){ toggle(this, 'ambiguous'); });

  lengthSlider.addEventListener('input', function(){
    state.length = parseInt(this.value);
    lengthValue.textContent = state.length;
    generatePassword();
  });

  document.getElementById('generateBtn').addEventListener('click', generatePassword);

  copyBtn.addEventListener('click', async function(){
    const raw = display.dataset.raw || '';
    if(!raw) return;
    try{
      await navigator.clipboard.writeText(raw);
      copyBtn.textContent = 'Copiado';
      copyBtn.classList.add('copied');
      setTimeout(() => {
        copyBtn.textContent = 'Copiar';
        copyBtn.classList.remove('copied');
      }, 1500);
    }catch(e){
      copyBtn.textContent = 'Error';
    }
  });

  generatePassword();

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('sw.js').catch(() => {});
    });
  }
</script>

</body>
</html>
